services:
  - type: web
    name: lume-creators
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: LUME_DATA_DIR
        value: /var/data
    disk:
      name: lume-data
      mountPath: /var/data
      sizeGB: 2
